# Cucumber configuration for the ED-01 suite.
# Goes in src/test/resources/ so it lands on the test classpath.

# Where the step definitions live. RunCucumberTest also sets this via
# @ConfigurationParameter; keeping it here means plain `mvn test` behaves the same
# even if the suite class is not the entry point.
cucumber.glue=edu.ics240.dispatch.bdd

# pretty    - readable step-by-step output in the console
# summary   - counts at the end
# html/json - reports written under target/
cucumber.plugin=pretty, summary, html:target/cucumber-report.html, json:target/cucumber.json


cucumber.object-factory=io.cucumber.spring.SpringFactory

# Suppress the "share your report on cucumber.io" banner.
cucumber.publish.quiet=true

# Style used when Cucumber prints a snippet for a step you have not defined yet.
cucumber.snippet-type=camelcase

# Uncomment to run a subset. Tags in these features:
#   @ED-01 @main-flow @safety @proposed
#   @ALT-1A @ALT-2A @ALT-5A @ALT-6A @ALT-6B @ALT-7A
#   @step-2 @step-3 @step-8 @step-9
#   @concurrency @toctou @idempotency @timeout @delivery
#
# Run only the documented use case, excluding the flows the narrative does not define:
#cucumber.filter.tags=@ED-01 and not @proposed
#
# Run only the safety properties:
#cucumber.filter.tags=@safety

# Note: there is no "strict" setting to enable. Since Cucumber 6, undefined and pending
# steps fail the run by default, which is what you want.
