<svg viewBox="0 0 1320 850" width="1320" height="850" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>ED-01 Step 1 revised sequence diagram</title>
<desc>Revised UML sequence diagram for ED-01 Step 1: the dispatcher completes a call evaluation as a single command on the AmbulanceCallCenter aggregate root, with a guarded transition to ready-for-dispatch and an alternative flow for calls that do not require an ambulance.</desc>

<defs>
<marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1f1d"/>
</marker>
<marker id="solidA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
</marker>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6b6b66" stroke-width="1.4"/>
</marker>
<marker id="openA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c15f3c" stroke-width="1.4"/>
</marker>
</defs>

<style>
.hdr{fill:#f0efe9;stroke:#d4d2c8;stroke-width:1}
.hname{font-size:11.5px;font-weight:600;fill:#1f1f1d;text-anchor:middle}
.hster{font-size:9.5px;fill:#6b6b66;text-anchor:middle}
.ll{stroke:#d4d2c8;stroke-width:1;stroke-dasharray:4 4}
.act{fill:#f0efe9;stroke:#6b6b66;stroke-width:1}
.m{stroke:#1f1f1d;stroke-width:1.3;fill:none}
.ma{stroke:#c15f3c;stroke-width:1.5;fill:none}
.r{stroke:#6b6b66;stroke-width:1.1;fill:none;stroke-dasharray:5 3}
.ra{stroke:#c15f3c;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
.lbl{font-size:10.5px;fill:#1f1f1d;text-anchor:middle}
.lbla{font-size:10.5px;fill:#c15f3c;font-weight:600;text-anchor:middle}
.frag{fill:none;stroke:#c15f3c;stroke-width:1.1}
.fragt{fill:#f0efe9;stroke:#c15f3c;stroke-width:1.1}
.fl{font-size:10px;font-weight:700;fill:#c15f3c}
.guard{font-size:10px;font-style:italic;fill:#c15f3c}
.tx{stroke:#6b6b66;stroke-width:1.1;stroke-dasharray:7 4}
.txl{font-size:10px;font-weight:600;fill:#6b6b66;text-anchor:middle}
.note{fill:#f0efe9;stroke:#d4d2c8;stroke-width:1}
.notet{font-size:9.5px;fill:#6b6b66}
.ttl{font-size:14px;font-weight:700;fill:#1f1f1d}
.sub{font-size:10.5px;fill:#6b6b66}
.sn{font-size:10px;font-weight:700;fill:#6b6b66}
</style>

<rect x="0" y="0" width="1320" height="850" fill="#ffffff"/>

<text class="ttl" x="14" y="20">ED-01 STEP 1 (revised) — Complete Evaluation and Queue Call for Dispatch</text>
<text class="sub" x="14" y="35">Accent = changed from v1. One command on the aggregate root; queue insertion is guarded, not unconditional.</text>

<circle cx="68" cy="55" r="7" fill="none" stroke="#1f1f1d" stroke-width="1.3"/>
<path d="M68 62 v16 M58 68 h20 M68 78 l-8 11 M68 78 l8 11" stroke="#1f1f1d" stroke-width="1.3" fill="none"/>
<text class="hname" x="68" y="103">Emergency</text>
<text class="hname" x="68" y="115">Dispatcher</text>

<rect class="hdr" x="170" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="245" y="66">DispatchWorkspace</text><text class="hster" x="245" y="79">«boundary»</text>

<rect class="hdr" x="355" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="430" y="66">DispatchController</text><text class="hster" x="430" y="79">«control» Spring MVC</text>

<rect class="hdr" x="545" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="620" y="62">AmbulanceDispatch-</text><text class="hname" x="620" y="74">Facade</text><text class="hster" x="620" y="85">«application facade»</text>

<rect class="hdr" x="745" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="820" y="62">AmbulanceCallCenter</text><text class="hster" x="820" y="75">«aggregate root»</text><text class="hster" x="820" y="85">owns waitingCalls</text>

<rect class="hdr" x="935" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="1010" y="66">AmbulanceCall</text><text class="hster" x="1010" y="79">«entity»</text>

<rect class="hdr" x="1120" y="46" width="150" height="42" rx="3"/>
<text class="hname" x="1195" y="62">PriorityQueue</text><text class="hster" x="1195" y="74">waitingCalls</text><text class="hster" x="1195" y="85">«internal»</text>

<line class="ll" x1="68" y1="120" x2="68" y2="800"/>
<line class="ll" x1="245" y1="88" x2="245" y2="800"/>
<line class="ll" x1="430" y1="88" x2="430" y2="800"/>
<line class="ll" x1="620" y1="88" x2="620" y2="800"/>
<line class="ll" x1="820" y1="88" x2="820" y2="800"/>
<line class="ll" x1="1010" y1="88" x2="1010" y2="800"/>
<line class="ll" x1="1195" y1="88" x2="1195" y2="800"/>

<rect class="act" x="240" y="140" width="10" height="530"/>
<rect class="act" x="425" y="172" width="10" height="40"/>
<rect class="act" x="615" y="205" width="10" height="465"/>
<rect class="act" x="815" y="238" width="10" height="400"/>
<rect class="act" x="1005" y="318" width="10" height="60"/>
<rect class="act" x="1005" y="425" width="10" height="20"/>
<rect class="act" x="1005" y="580" width="10" height="20"/>
<rect class="act" x="1190" y="470" width="10" height="18"/>

<text class="sn" x="14" y="146">1. Complete</text>
<text class="sn" x="14" y="158">evaluation</text>

<line class="ma" x1="68" y1="140" x2="238" y2="140" marker-end="url(#solidA)"/>
<text class="lbla" x="156" y="134">1. completeEvaluation(callId, evaluation)</text>

<line class="ma" x1="250" y1="172" x2="423" y2="172" marker-end="url(#solidA)"/>
<text class="lbla" x="337" y="166">2. completeEvaluation(callId, evaluation)</text>

<line class="ma" x1="435" y1="205" x2="613" y2="205" marker-end="url(#solidA)"/>
<text class="lbla" x="524" y="199">3. completeEvaluation(callId, evaluation)</text>

<line class="ma" x1="625" y1="238" x2="813" y2="238" marker-end="url(#solidA)"/>
<text class="lbla" x="719" y="232">4. completeEvaluation(callId, evaluation)</text>

<line class="tx" x1="545" y1="260" x2="1290" y2="260"/>
<text class="txl" x="917" y="256">atomic transaction begins — call state and queue commit together</text>

<path class="m" d="M825 283 h44 v22 h-42" marker-end="url(#solid)"/>
<text class="lbl" x="930" y="288" text-anchor="start">5. getCall(callId)  «internal lookup»</text>

<line class="ma" x1="825" y1="318" x2="1003" y2="318" marker-end="url(#solidA)"/>
<text class="lbla" x="914" y="312">6. completeEvaluation(evaluation)</text>
<text class="guard" x="914" y="332" text-anchor="middle">sets priority, requiredCapability, jurisdiction, requiresDispatch</text>

<line class="ma" x1="825" y1="358" x2="1003" y2="358" marker-end="url(#solidA)"/>
<text class="lbla" x="914" y="352">7. requiresDispatch()</text>
<line class="ra" x1="1003" y1="378" x2="827" y2="378" marker-end="url(#openA)"/>
<text class="lbla" x="914" y="373">boolean</text>

<rect class="frag" x="200" y="396" width="1090" height="272" rx="2"/>
<path class="fragt" d="M200 396 h58 v14 l-10 10 H200 z"/>
<text class="fl" x="209" y="409">alt</text>
<text class="guard" x="266" y="409">[ requiresDispatch == true ]</text>

<line class="ma" x1="825" y1="425" x2="1003" y2="425" marker-end="url(#solidA)"/>
<text class="lbla" x="914" y="419">8. markReadyForDispatch()</text>

<rect class="note" x="1042" y="432" width="240" height="30" rx="3"/>
<text class="notet" x="1052" y="445">throws if evaluation incomplete;</text>
<text class="notet" x="1052" y="456">no-op if already ready (idempotent)</text>

<line class="ma" x1="825" y1="478" x2="1188" y2="478" marker-end="url(#solidA)"/>
<text class="lbla" x="1006" y="472">9. addCall(call)  — reached only after a real state transition</text>

<line class="ra" x1="813" y1="512" x2="627" y2="512" marker-end="url(#openA)"/>
<text class="lbla" x="720" y="506">10. CALL_QUEUED</text>

<line class="ma" x1="613" y1="545" x2="252" y2="545" marker-end="url(#solidA)"/>
<text class="lbla" x="432" y="539">11. displayCallReadyForDispatch(callId)</text>

<line x1="200" y1="565" x2="1290" y2="565" stroke="#c15f3c" stroke-width="1.1" stroke-dasharray="6 4"/>
<text class="guard" x="212" y="579">[ requiresDispatch == false ]  — ALT 1A: evaluation concludes no ambulance required</text>

<line class="ma" x1="825" y1="600" x2="1003" y2="600" marker-end="url(#solidA)"/>
<text class="lbla" x="914" y="594">8. cancelDispatchRequirement()</text>
<text class="guard" x="1042" y="604" text-anchor="start">call never enters waitingCalls</text>

<line class="ra" x1="813" y1="628" x2="627" y2="628" marker-end="url(#openA)"/>
<text class="lbla" x="720" y="622">9. NO_DISPATCH_REQUIRED</text>

<line class="ma" x1="613" y1="655" x2="252" y2="655" marker-end="url(#solidA)"/>
<text class="lbla" x="432" y="649">10. displayCallNoLongerRequiresDispatch(callId)</text>

<line class="tx" x1="545" y1="686" x2="1290" y2="686"/>
<text class="txl" x="917" y="700">commit — invariant restored: call is in waitingCalls if and only if it is ready for dispatch</text>

<rect class="note" x="14" y="722" width="1276" height="70" rx="4"/>
<text class="notet" x="26" y="740" font-weight="700" fill="#1f1f1d">What changed from v1</text>
<text class="notet" x="26" y="756">1  getCall(callId) no longer returns the entity to the facade for outside mutation — completeEvaluation is now one command on the aggregate root (Tell, Don't Ask).</text>
<text class="notet" x="26" y="770">2  The evaluation payload is carried through the chain, so priority is actually set before the call is enqueued into a priority-ordered queue.</text>
<text class="notet" x="26" y="784">3  addCall is guarded by the requiresDispatch branch and an idempotent transition, closing the duplicate-enqueue path. 4  ALT 1A added. 5  Return path to the dispatcher closed.</text>

</svg>
