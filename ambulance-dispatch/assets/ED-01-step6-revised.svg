<svg viewBox="0 0 1310 940" width="1310" height="940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>ED-01 Step 6 revised sequence diagram</title>
<desc>Revised UML sequence diagram for ED-01 Step 6: validation reordered to check the call first, a missing-recommendation path added, the cancelled call removed from the waiting queue, and the retry path referencing steps 2 and 3.</desc>

<defs>
<marker id="s6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1f1d"/>
</marker>
<marker id="s6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
</marker>
<marker id="o6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6b6b66" stroke-width="1.4"/>
</marker>
<marker id="o6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c15f3c" stroke-width="1.4"/>
</marker>
</defs>

<style>
