<svg viewBox="0 0 1400 1110" width="1400" height="1110" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>ED-01 Step 7 revised sequence diagram</title>
<desc>Revised UML sequence diagram for ED-01 Step 7: the three final checks collapse into a single guarded atomic transition on assignTo, the only failable operation runs first, the call is marked dispatched and dequeued, and crew notification is deferred until after commit.</desc>

<defs>
<marker id="s7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1f1d"/>
</marker>
<marker id="s7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
</marker>
<marker id="o7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6b6b66" stroke-width="1.4"/>
</marker>
<marker id="o7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c15f3c" stroke-width="1.4"/>
</marker>
</defs>

