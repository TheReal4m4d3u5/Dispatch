<text class="hn" x="1010" y="68">AmbulanceCall</text><text class="hs" x="1010" y="80">«entity»</text>

<rect class="hdr" x="1092" y="44" width="136" height="42" rx="3"/>
<text class="hn" x="1160" y="68">Ambulance</text><text class="hs" x="1160" y="80">«entity»</text>

<rect class="hdr" x="1242" y="44" width="136" height="42" rx="3"/>
<text class="hn" x="1310" y="68">DispatchRecord</text><text class="hs" x="1310" y="80">«entity»</text>

