</style>

<rect x="0" y="0" width="1400" height="1110" fill="#ffffff"/>

<text class="ttl" x="14" y="20">ED-01 STEP 7 (revised) — Dispatcher Confirms Dispatch</text>
<text class="sub" x="14" y="35">Accent = changed. Checking immediately before mutating is not the same as mutating atomically.</text>

<circle cx="60" cy="55" r="6" fill="none" stroke="#1f1f1d" stroke-width="1.2"/>
<path d="M60 61 v14 M52 66 h16 M60 75 l-7 10 M60 75 l7 10" stroke="#1f1f1d" stroke-width="1.2" fill="none"/>
<text class="hn" x="60" y="99">Dispatcher</text>

<rect class="hdr" x="117" y="44" width="136" height="42" rx="3"/>
<text class="hn" x="185" y="62">Dispatch-</text><text class="hn" x="185" y="73">Workspace</text><text class="hs" x="185" y="83">«boundary»</text>

<rect class="hdr" x="267" y="44" width="136" height="42" rx="3"/>
<text class="hn" x="335" y="62">Dispatch-</text><text class="hn" x="335" y="73">Controller</text><text class="hs" x="335" y="83">«control»</text>

<rect class="hdr" x="427" y="44" width="136" height="42" rx="3"/>
<text class="hn" x="495" y="62">AmbulanceDispatch-</text><text class="hn" x="495" y="73">Facade</text><text class="hs" x="495" y="83">«app facade»</text>

