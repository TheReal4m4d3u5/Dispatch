.r{stroke:#6b6b66;stroke-width:1.1;fill:none;stroke-dasharray:5 3}
.ra{stroke:#c15f3c;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
.l{font-size:9.5px;fill:#1f1f1d;text-anchor:middle}
.la{font-size:9.5px;fill:#c15f3c;font-weight:600;text-anchor:middle}
.frag{fill:none;stroke:#c15f3c;stroke-width:1.1}
.fragn{fill:none;stroke:#6b6b66;stroke-width:1.1}
