<rect x="0" y="0" width="1290" height="760" fill="#ffffff"/>

<text class="ttl" x="14" y="20">ED-01 STEP 8 (revised) — Send the Emergency Assignment to the Selected Ambulance Crew</text>
<text class="sub" x="14" y="35">v1 has one method here. It has the wrong verb, the wrong parameter, no return value, and no way to know who to send to.</text>

<rect class="hdr" x="35" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="110" y="64">AmbulanceDispatch-</text><text class="hn" x="110" y="75">Facade</text><text class="hs" x="110" y="85">«app facade»</text>

<rect class="hdr" x="215" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="290" y="64">AmbulanceCall-</text><text class="hn" x="290" y="75">Center</text><text class="hs" x="290" y="85">«aggregate root»</text>

<rect class="hdr" x="395" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="470" y="70">DispatchRecord</text><text class="hs" x="470" y="83">«entity»</text>

<rect class="hdr" x="565" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="640" y="70">Ambulance</text><text class="hs" x="640" y="83">«entity»</text>

<rect class="hdr" x="755" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="830" y="64">CrewNotification-</text><text class="hn" x="830" y="75">Service</text><text class="hs" x="830" y="85">«NEW» transport</text>

<rect class="hdr" x="955" y="48" width="150" height="42" rx="3"/>
<text class="hn" x="1030" y="64">AmbulanceCrew-</text><text class="hn" x="1030" y="75">Workspace</text><text class="hs" x="1030" y="85">«boundary» in-vehicle</text>

<circle cx="1200" cy="58" r="7" fill="none" stroke="#1f1f1d" stroke-width="1.2"/>
<path d="M1200 65 v14 M1191 70 h18 M1200 79 l-7 10 M1200 79 l7 10" stroke="#1f1f1d" stroke-width="1.2" fill="none"/>
<text class="hn" x="1200" y="103">Ambulance Crew</text>

<line class="ll" x1="110" y1="90" x2="110" y2="520"/>
<line class="ll" x1="290" y1="90" x2="290" y2="520"/>
<line class="ll" x1="470" y1="90" x2="470" y2="520"/>
<line class="ll" x1="640" y1="90" x2="640" y2="520"/>
<line class="ll" x1="830" y1="90" x2="830" y2="520"/>
<line class="ll" x1="1030" y1="90" x2="1030" y2="520"/>
<line class="ll" x1="1200" y1="108" x2="1200" y2="520"/>

<rect class="act" x="105" y="126" width="10" height="330"/>
<rect class="act" x="285" y="140" width="10" height="290"/>
<rect class="act" x="635" y="152" width="10" height="18"/>
<rect class="act" x="825" y="248" width="10" height="90"/>
<rect class="act" x="1025" y="272" width="10" height="34"/>
<rect class="act" x="465" y="376" width="10" height="16"/>

<rect class="band" x="140" y="104" width="1120" height="15" rx="3"/>
<text class="bl" x="700" y="115">STEP 7 committed. DispatchRecord exists with status CREATED; outbox row written in the same transaction so this send cannot be lost.</text>

<line class="ma" x1="115" y1="132" x2="283" y2="132" marker-end="url(#qa)"/>
<text class="la" x="199" y="126">8.1  notifyCrew(dispatchId)</text>

<line class="ma" x1="300" y1="158" x2="633" y2="158" marker-end="url(#qa)"/>
<text class="la" x="466" y="152">8.2  getAssignedCrew()</text>
<line class="ra" x1="633" y1="176" x2="302" y2="176" marker-end="url(#qo)"/>
<text class="la" x="466" y="171">AmbulanceCrew</text>

<rect class="warn" x="676" y="132" width="330" height="44" rx="4"/>
<text class="g" x="686" y="147" font-weight="700">This navigation does not exist</text>
<text class="g" x="686" y="159">AmbulanceCrew holds an Ambulance; nothing goes back.</text>
<text class="g" x="686" y="170">From a DispatchRecord you cannot reach the crew to notify.</text>

<path class="ma" d="M300 196 h44 v20 h-42" marker-end="url(#qa)"/>
<text class="la" x="352" y="201" text-anchor="start">8.3  assembleCrewAssignment(dispatchRecord, crew)</text>
<text class="g" x="352" y="217">address, cross-streets, priority, chief complaint, hazards, route, ETA — not the entity graph</text>

<line class="ma" x1="300" y1="254" x2="823" y2="254" marker-end="url(#qa)"/>
<text class="la" x="561" y="248">8.4  sendAssignment(crew, assignment, dispatchId)</text>

<line class="ma" x1="840" y1="278" x2="1023" y2="278" marker-end="url(#qa)"/>
<text class="la" x="931" y="272">8.5  deliver(assignment)</text>

<line class="ma" x1="1040" y1="312" x2="1192" y2="312" marker-end="url(#qa)"/>
<text class="la" x="1116" y="306">8.6  alert</text>

<line class="ra" x1="823" y1="344" x2="302" y2="344" marker-end="url(#qo)"/>
<text class="la" x="562" y="339">DeliveryResult   —   v1 returned void, so failure was unobservable</text>

<rect class="frag" x="60" y="358" width="1200" height="140" rx="2"/>
<path class="ft" d="M60 358 h56 v12 l-8 8 H60 z"/>
<text class="fl" x="67" y="369">alt</text>
<text class="g" x="120" y="369">[ DeliveryResult == DELIVERED ]</text>

<line class="ma" x1="300" y1="382" x2="463" y2="382" marker-end="url(#qa)"/>
<text class="la" x="381" y="376">8.7  markAssigned()</text>
<text class="g" x="500" y="382">DispatchStatus CREATED to ASSIGNED. ED-01 ends; the crew's reply is AC-02.</text>

<line x1="60" y1="400" x2="1260" y2="400" stroke="#c15f3c" stroke-width="1.1" stroke-dasharray="6 4"/>
<text class="g" x="72" y="413">[ FAILED, or no acknowledgement within T ]</text>

<line class="ma" x1="300" y1="440" x2="823" y2="440" marker-end="url(#qa)"/>
<text class="la" x="561" y="434">8.7  sendAssignment(...) retry — bounded, deduplicated on dispatchId</text>

<line class="ma" x1="283" y1="470" x2="118" y2="470" marker-end="url(#qa)"/>
<text class="la" x="200" y="464">8.8  crewNotResponding(dispatchId)</text>
<text class="g" x="330" y="470">→ alarm the dispatcher and offer reassignment. A dispatch nobody received is the failure no one would notice.</text>

<rect class="note" x="14" y="512" width="1262" height="238" rx="4"/>
<text class="nt" x="26" y="530" font-weight="700" fill="#1f1f1d">The one v1 method, audited</text>

<text class="nt" x="26" y="552">v1:</text>
<text class="mono" x="60" y="552" fill="#1f1f1d">void AmbulanceCrewWorkspace.displayAssignedEmergency(DispatchRecord dispatchRecord)</text>
<text class="nt" x="26" y="568">v2:</text>
<text class="mono" x="60" y="568" fill="#c15f3c">DeliveryResult CrewNotificationService.sendAssignment(AmbulanceCrew crew, CrewAssignment assignment, long dispatchId)</text>

<text class="nt" x="26" y="592">1  Wrong verb. "display" is a local render — right for DispatchWorkspace.displayRecommendation(), where the dispatcher is at the screen. Your use case says the system SENDS the assignment.</text>
<text class="nt" x="26" y="604">     The name decides what gets built: display...() becomes a method call; send...() forces someone to think about a transport, a result, and a failure mode.</text>
<text class="nt" x="26" y="621">2  No return value. This is the core defect. A send that can fail and returns void makes failure structurally invisible — there is no value to branch on, so no alternative flow can exist.</text>
<text class="nt" x="26" y="638">3  No recipient. displayAssignedEmergency(dispatchRecord) never says which crew. And it cannot be derived: AmbulanceCrew has a field pointing to Ambulance, but Ambulance has no field</text>
<text class="nt" x="26" y="650">     pointing back. From a DispatchRecord you reach the Ambulance and stop. You need Ambulance.getAssignedCrew(), or a shift-aware registry, since crews change and the mapping is time-varying.</text>
<text class="nt" x="26" y="667">4  Wrong parameter. DispatchRecord carries live AmbulanceCall and Ambulance references across a process boundary into a vehicle. It also lacks what the crew actually needs — cross-streets,</text>
<text class="nt" x="26" y="679">     chief complaint, scene hazards, route. A CrewAssignment DTO carries the right fields and nothing mutable.</text>
<text class="nt" x="26" y="696">5  Wrong collaborator. AmbulanceCrewWorkspace is a UI; the obligation is a transmission. Conflating them is why the failure mode vanished. Keep the workspace as what renders on the far</text>
<text class="nt" x="26" y="708">     side, and put a CrewNotificationService in front of it. Also: AmbulanceCrewWorkspace still is not in your class spec, so today the method has no declared owner at all.</text>
<text class="nt" x="26" y="725">6  Not idempotent. Any retry re-alerts the crew. Deduplicate on dispatchId so a repeated send is absorbed by the device rather than shown twice.</text>
<text class="nt" x="26" y="742" font-style="italic">7  Ordering: attempt the crew send before telling the dispatcher "dispatched." v1's message 39 fires after the dispatcher confirmation, so the screen asserts something not yet attempted.</text>

</svg>
