<svg viewBox="0 0 1290 760" width="1290" height="760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>ED-01 Step 8 revised — send assignment to crew</title>
<desc>Revised sequence diagram for ED-01 Step 8, auditing the single method that sends the emergency assignment to the ambulance crew: recipient resolution, view assembly, a send that returns a delivery result, and an escalation path.</desc>

<defs>
<marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
